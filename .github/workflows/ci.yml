name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so `base...HEAD` diffs have a merge base.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install frontend dependencies
        run: npm ci
      - name: Format check
        working-directory: src-tauri
        run: cargo fmt --check
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy -- -D warnings
      # The template's CLAUDE.md loads in every session of every vault; see
      # scripts/check-claude-md-budget.mjs.
      - name: CLAUDE.md budget
        run: node scripts/check-claude-md-budget.mjs
      - name: Test (frontend)
        run: npm test
      - name: Test (backend)
        working-directory: src-tauri
        run: cargo test
      - name: Build (frontend + app)
        run: npx tauri build --no-bundle
