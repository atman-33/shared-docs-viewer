[package]
name = "shared-docs-viewer"
version = "0.2.0"
edition = "2021"
description = "Shared folder document and diagram viewer"
license = "MIT"

# Desktop-only: keep the default rlib. Adding cdylib (only needed for mobile
# targets) makes the debug DLL exceed the PE export-ordinal limit on
# windows-gnu ("export ordinal too large").
[lib]
name = "shared_docs_viewer_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
# rustls-based (no schannel): avoids OS revocation-check failures seen on this network
ureq = { version = "2", features = ["json"] }
# PlantUML's URL encoding is raw deflate (Docs tab, T-0279). Already in the
# tree through ureq and png, so naming it costs no extra build.
flate2 = "1"
# task deletion goes to the OS recycle bin (restorable), never a hard delete
trash = "5"
tauri-plugin-notification = "2.3.3"
# single-instance guard: a second launch focuses the existing main window and
# exits instead of accumulating windowless/zombie processes (see lib.rs)
tauri-plugin-single-instance = "2"
# start-with-Windows: registers the exe under HKCU\...\CurrentVersion\Run.
# The plugin writes `current_exe()` every time it is enabled, which is what
# lets startup re-register a moved or self-updated exe (see lib.rs).
tauri-plugin-autostart = "2"
# embeds vault-template/ into the binary so a packaged build has no dev-machine
# path dependency for the template source (see src-tauri/src/tasks.rs).
include_dir = "0.7"

# ink overlay: Raw Input keyboard listener for the double-Alt temporary draw mode
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    # ink/clips: WTSRegisterSessionNotification, so the raw-input listener
    # hears about session lock/unlock and RDP connect/disconnect and can
    # re-register (see src-tauri/src/rawkey.rs).
    "Win32_System_RemoteDesktop",
    # voice input: clipboard save/restore around the paste-injection (the
    # focused app, not the viewer, owns the clipboard target — Win32 clipboard
    # APIs work regardless of which window has focus).
    "Win32_System_DataExchange",
    "Win32_System_Ole",
    "Win32_System_Memory",
    # voice indicator placement: the text caret of the *focused* app, read
    # via GetGUIThreadInfo (Win32 controls) and UI Automation (Chromium,
    # Electron, VS Code, ...) — see src-tauri/src/caret.rs.
    "Win32_UI_Accessibility",
    "Win32_System_Com",
    # ClientToScreen, for turning the client-relative caret rect returned by
    # GetGUIThreadInfo into screen coordinates; BitBlt and GetDIBits, for the
    # ink capture's screen grab (see src-tauri/src/ink/capture.rs).
    "Win32_Graphics_Gdi",
    # voice loopback: WASAPI capture of the render endpoint
    # (AUDCLNT_STREAMFLAGS_LOOPBACK) so meeting dictation hears the other
    # side's voice too — cpal has no loopback API (see
    # src-tauri/src/voice_loopback.rs).
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    # git graph: GetDriveTypeW + DRIVE_REMOTE, to skip auto commit-graph
    # writes on mapped network drives (see src-tauri/src/git.rs, T-0408).
    "Win32_Storage_FileSystem",
    "Win32_System_WindowsProgramming",
] }

[profile.release]
opt-level = 2
lto = "thin"
strip = true
